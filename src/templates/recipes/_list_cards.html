<div data-recipe-list-append-chunk style="display: contents">
  {% for recipe in recipes %}
    {% include "recipes/_recipe_card.html" %}
  {% endfor %}
</div>
{% if is_paginated and page_obj.has_next %}
  <p class="recipe-list-load-status" data-recipe-list-load-status hidden>Loading more recipes…</p>
  <div
    class="recipe-list-sentinel"
    data-recipe-list-sentinel
    data-next-page="{{ page_obj.next_page_number }}"
    aria-hidden="true"
  ></div>
{% endif %}

<details
  class="recipe-share"
  data-recipe-share
  data-share-title="{{ recipe.title }}"
  data-share-url="{{ request.build_absolute_uri }}"
>
  <summary class="button secondary icon-only-button recipe-share-summary" aria-label="Share recipe">
    <svg class="recipe-share-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <path
        d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
      <polyline
        points="16 6 12 2 8 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></polyline>
      <line x1="12" y1="2" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
    </svg>
  </summary>
  <div class="recipe-share-panel" role="menu" aria-label="Share recipe">
    <button type="button" class="recipe-share-option" role="menuitem" data-share-copy>Copy link</button>
    <button type="button" class="recipe-share-option" role="menuitem" data-share-email>Email</button>
    <p class="recipe-share-section-label">Shopping list</p>
    <button type="button" class="recipe-share-option" role="menuitem" data-share-copy-ingredients>Copy ingredients</button>
    <button type="button" class="recipe-share-option" role="menuitem" data-share-share-ingredients hidden>Share ingredients</button>
  </div>
</details>
{{ share_ingredient_lines|json_script:"recipe-share-ingredients" }}

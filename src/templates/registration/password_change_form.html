{% extends "base.html" %}

{% block title %}Change password - Family Recipes{% endblock %}

{% block content %}
  <section class="narrow-card auth-card">
    <p class="eyebrow">Security</p>
    <h1>Change password</h1>
    <p class="lede">Use a strong password that you do not reuse on other sites.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions form-actions">
        <button type="submit">Update password</button>
        <a class="button secondary" href="{% url 'accounts:profile' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}

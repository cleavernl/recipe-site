{% extends "base.html" %}

{% block title %}Log in - Family Recipes{% endblock %}

{% block content %}
  <section class="narrow-card auth-card">
    <p class="eyebrow">Private cookbook</p>
    <h1>Log in</h1>
    <p class="lede">Welcome back. Sign in to browse, add, and discuss family recipes.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions form-actions">
        <button type="submit">Log in</button>
      </div>
    </form>
    <p>Need an account? <a href="{% url 'accounts:signup' %}">Use your invite code to sign up</a>.</p>
  </section>
{% endblock %}

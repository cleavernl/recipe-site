{% extends "base.html" %}

{% block title %}Sign up - Family Recipes{% endblock %}

{% block content %}
  <section class="narrow-card auth-card">
    <p class="eyebrow">Invite only</p>
    <h1>Create your account</h1>
    <p class="lede">Accounts are private and require an invite code from the site owner.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions form-actions">
        <button type="submit">Create account</button>
      </div>
    </form>
  </section>
{% endblock %}

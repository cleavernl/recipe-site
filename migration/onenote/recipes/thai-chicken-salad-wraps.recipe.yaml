title: Thai Chicken Salad Wraps
description: |
  Crunchy Thai chicken salad wraps—fresh, bold Thai flavors, great for a light lunch or dinner. Use lettuce leaves or flour/tortilla wraps (see photo reference). Coleslaw mix can replace separate cabbage and carrots.
prep_time_minutes: 10
cook_time_minutes: 15
servings: 4
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "2"
    name: boneless, skinless chicken breasts
    notes: ""
  - quantity: "1 tbsp."
    name: olive oil
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: "1/2 cup"
    name: shredded carrots
    notes: or use coleslaw mix with cabbage
  - quantity: "1/2 cup"
    name: red cabbage
    notes: shredded; or use coleslaw mix
  - quantity: "1/4 cup"
    name: fresh cilantro
    notes: chopped
  - quantity: "1/4 cup"
    name: chopped peanuts
    notes: optional
  - quantity: "1/4 cup"
    name: green onions
    notes: sliced
  - quantity: "8"
    name: large lettuce leaves
    notes: butter lettuce or romaine; or use tortilla/flour wraps
  - quantity: "3 tbsp."
    name: peanut butter
    notes: for dressing
  - quantity: "2 tbsp."
    name: soy sauce
    notes: for dressing
  - quantity: "1 tbsp."
    name: rice vinegar
    notes: for dressing
  - quantity: "1 tbsp."
    name: lime juice
    notes: for dressing
  - quantity: "1 tsp."
    name: honey
    notes: for dressing
  - quantity: "1 tsp."
    name: sesame oil
    notes: for dressing
  - quantity: "1/2 tsp."
    name: sriracha
    notes: optional, for dressing

steps:
  - Season chicken with olive oil, salt, and pepper. Grill or pan-sear over medium heat for 6–7 minutes per side, or until fully cooked. Let rest, then shred.
  - In a small bowl, whisk together peanut butter, soy sauce, rice vinegar, lime juice, honey, sesame oil, and sriracha if using.
  - In a large bowl, combine shredded chicken, carrots, cabbage, cilantro, peanuts if using, and green onions. Toss with dressing until well coated.
  - Scoop salad into lettuce leaves or wraps and serve.


title: Spinach, Mushroom & Ricotta Stuffed Zucchini Boats
description: |
  Fresh spin on Italian flavors—a satisfying vegetarian dish packed with protein and fiber. Great as a side or main. Also excellent with Italian sausage (ground mild/sweet and spicy blend) or ground turkey.
prep_time_minutes:
cook_time_minutes: 30
servings:
source_url: ""
tags:
  - vegetarian
  - dinner

ingredients:
  - quantity: "2"
    name: medium zucchini
    notes: ""
  - quantity: "1/2 cup"
    name: mushrooms
    notes: sliced
  - quantity: "1 tbsp."
    name: extra virgin olive oil
    notes: plus more for brushing shells
  - quantity: "2 cups"
    name: fresh spinach
    notes: or 1/4 cup defrosted frozen spinach
  - quantity: "1 tsp."
    name: garlic
    notes: minced
  - quantity: "1/2 cup"
    name: ricotta cheese
    notes: ""
  - quantity: "1/2 cup"
    name: shredded mozzarella
    notes: for filling
  - quantity: "1/4 cup"
    name: grated Parmesan
    notes: ""
  - quantity: "1 tsp."
    name: Italian seasoning
    notes: ""
  - quantity: "1/2 tsp."
    name: red pepper flakes
    notes: optional
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: "1/4 cup"
    name: shredded mozzarella
    notes: for topping
  - quantity: "2 tbsp."
    name: Panko breadcrumbs
    notes: optional, for crunch
  - quantity: ""
    name: fresh basil or parsley
    notes: for garnish

steps:
  - Preheat oven to 400°F. Cut zucchini in half lengthwise. Scoop out centers (reserve for filling), leaving about 1/4-inch-thick shells. Lightly brush with oil, sprinkle with salt, and bake cut-side up for 10 minutes.
  - Heat oil in a skillet over medium heat. Sauté mushrooms until golden, 5–6 minutes. Add garlic, chopped zucchini centers, and spinach. Cook until spinach wilts, 2–3 minutes. Remove from heat. Stir in ricotta, mozzarella for filling, Parmesan, and seasonings.
  - Divide filling among zucchini shells. Top with mozzarella for topping and Panko if using. Bake 15–20 minutes until cheese is bubbly and golden. Broil 1–2 minutes for extra crispiness if desired.
  - Garnish with fresh herbs and serve hot.


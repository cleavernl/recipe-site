title: Chicken Philly Sandwiches
description: |
  Slow cooker chicken Philly sandwiches. Mom note: mushrooms can go in the crockpot with peppers, or sauté and add to sandwiches. Peppers, extra onions, and mushrooms can be sautéed instead of slow-cooked; some onion in the crockpot while chicken cooks adds good flavor.
prep_time_minutes:
cook_time_minutes:
servings: 4
source_url: ""
tags:
  - crockpot
  - chicken
  - dinner

ingredients:
  - quantity: "2 lbs"
    name: boneless skinless chicken breasts
    notes: ""
  - quantity: "1 tsp."
    name: garlic powder
    notes: ""
  - quantity: "1 tsp."
    name: onion powder
    notes: ""
  - quantity: "1 tsp."
    name: smoked paprika
    notes: ""
  - quantity: "1/2 tsp."
    name: salt
    notes: ""
  - quantity: "1/4 tsp."
    name: black pepper
    notes: ""
  - quantity: "1 cup"
    name: chicken broth
    notes: ""
  - quantity: "1"
    name: green bell pepper
    notes: sliced
  - quantity: "1"
    name: red bell pepper
    notes: sliced
  - quantity: "1"
    name: medium onion
    notes: sliced
  - quantity: ""
    name: mushrooms
    notes: optional; see description
  - quantity: "8 slices"
    name: provolone cheese
    notes: or preferred cheese
  - quantity: "4"
    name: hoagie rolls
    notes: toasted
  - quantity: ""
    name: ranch dressing or mayonnaise
    notes: optional, for topping

steps:
  - Place chicken in the slow cooker. Season with garlic powder, onion powder, smoked paprika, salt, and pepper. Pour in chicken broth. Cover and cook on LOW 6–7 hours or HIGH 3–4 hours, until tender and easy to shred.
  - During the last hour, add sliced bell peppers and onion (and mushrooms if using in the crockpot).
  - Preheat oven to 375°F (190°C). Shred chicken and stir into vegetables in the slow cooker.
  - Fill each hoagie roll with chicken and vegetables. Top with provolone. Place on a baking sheet and bake about 5 minutes, until cheese melts.
  - Drizzle with ranch or mayonnaise if desired. Serve warm.


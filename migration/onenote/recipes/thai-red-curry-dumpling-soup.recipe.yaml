title: Thai Red Curry Dumpling Soup
description: |
  Simpler red-curry dumpling soup variant. Directions mention adding vegetables with the dumplings; none were listed in the original ingredient block.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - soup
  - dinner

ingredients:
  - quantity: ""
    name: frozen potstickers or Asian dumplings
    notes: amount per package or as needed
  - quantity: "1 tbsp."
    name: vegetable oil
    notes: ""
  - quantity: "1"
    name: onion
    notes: finely chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 tbsp."
    name: fresh ginger
    notes: grated
  - quantity: "2 tbsp."
    name: red curry paste
    notes: ""
  - quantity: "4 cups"
    name: vegetable broth
    notes: ""
  - quantity: "1 can"
    name: coconut milk
    notes: 14 oz
  - quantity: "1 tbsp."
    name: soy sauce
    notes: ""
  - quantity: "1 tbsp."
    name: lime juice
    notes: plus extra for serving
  - quantity: ""
    name: cilantro and/or Thai basil
    notes: for garnish
  - quantity: ""
    name: vegetables
    notes: optional; add with dumplings per directions

steps:
  - Heat oil in a pot over medium heat. Sauté onion, garlic, and ginger until fragrant, about 1–2 minutes. Stir in red curry paste and cook briefly until fragrant.
  - Add coconut milk and simmer until combined.
  - Pour in vegetable broth and bring to a boil.
  - Add optional vegetables and frozen dumplings. Cook until dumplings float and are heated through.
  - Stir in soy sauce and lime juice. Garnish with cilantro and/or Thai basil before serving.


title: Chicken Chili
description: |
  Crack Chicken Chili. For thinner soup, add an extra 1/2–1 cup water with the broth.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - crockpot
  - chicken
  - soup
  - dinner

ingredients:
  - quantity: "2 lbs"
    name: boneless skinless chicken breasts
    notes: about 4 breasts
  - quantity: "1 can"
    name: chicken broth
    notes: 15 oz
  - quantity: "1"
    name: ranch seasoning mix
    notes: 1 oz package
  - quantity: "2 tsp."
    name: chili powder
    notes: ""
  - quantity: "1 tsp."
    name: ground cumin
    notes: ""
  - quantity: "1 tsp."
    name: kosher salt
    notes: plus more to taste
  - quantity: "1 can"
    name: black beans
    notes: 15 oz, rinsed and drained
  - quantity: "1 can"
    name: pinto beans
    notes: 15 oz, optional
  - quantity: "1 can"
    name: white corn
    notes: 15 oz, rinsed and drained
  - quantity: "1 can"
    name: Ro-Tel tomatoes and green chiles
    notes: 10 oz; or diced tomatoes plus green chilies
  - quantity: "8 oz"
    name: cream cheese
    notes: softened and cubed
  - quantity: "1 cup"
    name: shredded cheddar cheese
    notes: ""
  - quantity: "1/2 cup"
    name: bacon crumbles
    notes: ""
  - quantity: ""
    name: tortilla chips
    notes: optional topping
  - quantity: ""
    name: sour cream
    notes: optional topping
  - quantity: ""
    name: avocado
    notes: optional topping
  - quantity: ""
    name: cilantro
    notes: optional topping

steps:
  - In a crockpot, add chicken and chicken broth (plus 1/2–1 cup water if you want it thinner). Sprinkle ranch seasoning, chili powder, cumin, and salt over top. Add black beans, pinto beans if using, corn, and Ro-Tel.
  - Cover and cook on LOW 6–7 hours or HIGH 3–4 hours, until chicken is tender.
  - Transfer chicken to a cutting board and shred. Return to the crockpot. Add cream cheese (on top is fine); let sit about 10 minutes, then stir until smooth.
  - Mix in 1/2 cup cheddar and 1/4 cup bacon. Sprinkle remaining cheese and bacon on top. Cook on LOW 15 minutes more, or until cheese melts. Season to taste; add water or seasonings if needed.
  - Ladle into bowls and add optional toppings.


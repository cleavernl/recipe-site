title: Tourtière
description: |
  Family recipe. About a half-day process; spices develop over long cooking—taste throughout and don't adjust too quickly.

  Spice note: double all spices except salt to start (probably triple cloves; triple garlic). Ginger and allspice are add-ins—amounts are approximate. Adjust to taste after cooking progresses.

  Yield: single recipe makes about 2 pies; doubled makes about 4 (depends on pan size and deep-dish vs standard).

  Baking: bake at 425°F for 10 minutes, then 350°F for 30 minutes. Slightly underbake if freezing or reheating whole pies to avoid over-dark crust; cover edges while baking. Reheat covered with foil at 325–350°F; remove foil briefly to brown crust.

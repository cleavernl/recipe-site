steps:
  - Peel potatoes and cook with salt as you normally would (no other additions). Mash without milk or butter. Set aside.
  - Cook meat without draining. Add onions and cook until nearly translucent. Add garlic, then spices. Cook until grease is nearly gone.
  - Add 1 1/2 cups water; cook until nearly gone. Add 1/3 cup water; cook until nearly gone. This reduction takes hours.
  - In a large bowl, mix mashed potatoes and meat filling.
  - Roll out bottom crust, fill with mixture, and add top crust. Cover crust edges to prevent over-browning.
  - Bake at 425°F for 10 minutes. Reduce heat to 350°F and bake 30 minutes more (slightly underbake if freezing for later reheat).


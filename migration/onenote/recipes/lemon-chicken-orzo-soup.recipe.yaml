steps:
  - Sauté onion in a large pot until translucent. Add chicken broth and bring to a boil.
  - Add orzo and cook until al dente.
  - Stir in shredded chicken, heavy cream, lemon juice, and lemon zest.
  - Add spinach and cook until wilted.
  - Season with salt and pepper.
  - Serve hot, garnished with parsley.


title: Chicken Alfredo Lasagna with Spinach
description: |
  Make-ahead notes: chicken can be cooked the day before and refrigerated so seasonings absorb; assembled lasagna can chill overnight so flavors meld. Baking from fridge may need 10–15 extra minutes—when cheese is bubbly, you're good, then broil to brown the top. Toothpicks under the foil keep it from sticking to melted cheese.

  Seasoning note: amounts below are starting points; Mom coated tenders on each side and used more—double or triple if using a large batch of chicken (e.g. two Costco breasts cut into tenders).
prep_time_minutes:
cook_time_minutes: 45
servings:
source_url: ""
tags:
  - pasta
  - chicken
  - dinner

ingredients:
  - quantity: "6+"
    name: chicken tenders
    notes: or boneless skinless breasts cut into tenders
  - quantity: "1 tsp."
    name: salt
    notes: for chicken, or to taste
  - quantity: "1/2 tsp."
    name: pepper
    notes: for chicken
  - quantity: "1 tsp."
    name: cayenne
    notes: for chicken
  - quantity: "1 tsp."
    name: garlic powder
    notes: for chicken
  - quantity: "1 tsp."
    name: Italian seasoning
    notes: for chicken; or ~1 tsp each oregano, parsley, and basil
  - quantity: "2 tbsp."
    name: olive oil
    notes: for chicken
  - quantity: "2 tbsp."
    name: butter
    notes: for chicken; more as needed when cooking in batches
  - quantity: "5 tbsp."
    name: unsalted butter
    notes: for spinach Alfredo sauce
  - quantity: "1/2"
    name: medium onion
    notes: finely chopped, for sauce
  - quantity: "4–5 cloves"
    name: garlic
    notes: minced, for sauce
  - quantity: "1 tsp."
    name: salt
    notes: for sauce, or to taste (kosher works well)
  - quantity: "1/2 tsp."
    name: pepper
    notes: for sauce (coarse ground)
  - quantity: "1 tsp."
    name: crushed red pepper flakes
    notes: for sauce
  - quantity: "1 tsp."
    name: Italian seasoning
    notes: for sauce
  - quantity: "5 tbsp."
    name: all-purpose flour
    notes: for sauce
  - quantity: "2 cups"
    name: whole milk
    notes: almond milk works
  - quantity: "1 cup"
    name: heavy cream
    notes: fat-free half and half works
  - quantity: "1 cup"
    name: grated Parmesan cheese
    notes: freshly grated, for sauce
  - quantity: "1"
    name: ricotta cheese
    notes: 15 oz package, for sauce
  - quantity: "1"
    name: spinach
    notes: 10 oz package, for sauce
  - quantity: "9–10"
    name: lasagna noodles
    notes: for assembly
  - quantity: "3–4 cups"
    name: shredded mozzarella cheese
    notes: for assembly, about 3/4 cup per layer plus 1 cup on top
  - quantity: ""
    name: olive oil
    notes: toss with cooked noodles to prevent sticking
  - quantity: ""
    name: cooking spray
    notes: for 9×13-inch dish
  - quantity: ""
    name: wooden toothpicks
    notes: 6–8, to hold foil above cheese
  - quantity: ""
    name: fresh parsley
    notes: chopped, optional garnish

steps:
  - Boil lasagna noodles per package directions to al dente. Toss with a little olive oil to prevent sticking.
  - Coat chicken tenders with salt, pepper, cayenne, garlic powder, and Italian seasoning. Heat a cast iron skillet on medium-high with butter and olive oil. Cook tenders in a single layer until cooked through and lightly seared, about 5 minutes per side, adding more butter/oil and batches as needed. Rest tenders, scrape in brown bits, chop into bite-size pieces, and set aside with juices.
  - For spinach Alfredo sauce, melt butter in a large pan over medium-high heat. Sauté onion until softened, 3–5 minutes (garlic can be added with onion). Add garlic if cooked separately and cook 1–2 minutes until fragrant.
  - Add salt, pepper, red pepper flakes, and Italian seasoning; cook 1 minute. Add spinach and cook until wilted. Stir in flour, toast 1 minute, then add milk and cream. Stir well, then add Parmesan and ricotta, pressing ricotta against the pan sides to break it up. Cook over medium heat, stirring, until slightly thickened.
  - Add chopped chicken with all pan juices; heat through and adjust seasonings.
  - Preheat oven to 375°F. Spray a 9×13-inch dish with cooking spray (optional thin sauce layer on bottom).
  - First layer—about 3 noodles, generous sauce, and ~3/4 cup mozzarella. Repeat for second and third layers, reserving some sauce and 3 noodles.
  - Final layer—top noodles, remaining sauce, and about 1 cup mozzarella. Insert 6–8 toothpicks across the top. Cover with foil and bake at 350°F for 35–45 minutes (longer if baking from cold). Broil uncovered 2–3 minutes to brown cheese.


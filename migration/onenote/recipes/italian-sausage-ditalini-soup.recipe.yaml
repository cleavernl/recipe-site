title: Italian Sausage Ditalini Soup
description: |
  Creamy Parmesan Italian Sausage Ditalini Soup.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - soup
  - dinner

ingredients:
  - quantity: "1 lb"
    name: Italian sausage
    notes: casings removed; sweet and spicy half-and-half works well (freeze leftover half for next batch)
  - quantity: "1 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1"
    name: small onion
    notes: diced
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 can"
    name: diced tomatoes
    notes: 14.5 oz, drained
  - quantity: "4 cups"
    name: chicken broth
    notes: ""
  - quantity: "1 cup"
    name: heavy cream
    notes: or fat-free half and half
  - quantity: "1 cup"
    name: small pasta
    notes: ditalini or elbow
  - quantity: "1 cup"
    name: shredded Parmesan cheese
    notes: ""
  - quantity: "1/2 tsp."
    name: dried basil
    notes: ""
  - quantity: "1/2 tsp."
    name: dried oregano
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: fresh parsley
    notes: chopped, for garnish

steps:
  - Heat olive oil in a large pot over medium heat. Add Italian sausage, breaking it up as it cooks until browned. Remove sausage from the pot and set aside.
  - In the same pot, add diced onion and minced garlic. Cook until the onion is translucent, about 3–4 minutes.
  - Stir in drained diced tomatoes, chicken broth, dried basil, and dried oregano. Bring to a boil.
  - Add pasta and cook until al dente, approximately 8–10 minutes.
  - Reduce heat to medium-low. Stir in heavy cream and shredded Parmesan until the cheese melts and the soup thickens.
  - Return cooked sausage to the pot and stir to combine. Season with salt and pepper to taste.
  - Ladle into bowls, garnish with parsley, and serve.


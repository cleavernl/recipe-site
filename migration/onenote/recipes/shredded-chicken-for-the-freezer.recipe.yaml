title: Shredded Chicken for the Freezer
description: |
  Batch prep for the freezer. Use shredded chicken for quesadillas, chicken salad, enchiladas, and more. Remove onions and large pieces (leave small bits). Save the cooking broth and freeze—it is more flavorful and concentrated than canned broth.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - prep
  - crockpot
  - chicken

ingredients:
  - quantity: ""
    name: chicken breasts or thighs
    notes: bone-in, with skin; amount as needed for batch
  - quantity: ""
    name: water
    notes: a bit, for the crockpot
  - quantity: ""
    name: lemon pepper
    notes: sprinkle to taste
  - quantity: ""
    name: onion
    notes: sliced, layered between chicken pieces

steps:
  - Add a bit of water to the crockpot. Sprinkle chicken with lemon pepper. Layer onion slices between pieces of chicken.
  - Cook on LOW for 6–8 hours, depending on size of pieces, until very fork-tender.
  - Remove from crockpot and let cool slightly. Remove skin and bones. Shred meat and pack into freezer bags.
  - Discard onions and large pieces (small bits may be left in the chicken). Strain and freeze the cooking broth for later use.


title: Tomato Compote
description: |
  Sweet Italian cherry tomato compote. Halve tomatoes or leave whole (either works).

  Slow cooker: LOW about 6 hours until tomatoes are soft, wrinkled, and some have burst. Store in an airtight container in the refrigerator, or can (see below).

  Serving ideas: spread on ricotta or avocado toast; toss with pasta; grilled cheese; use oil and juices in dressings; with roasted meats or vegetables; on pesto scrambled eggs and spinach; cheese board with soft cheeses; grilled bread or crostini.

  Canning: prepare 1/2-pint jars, lids, and bands. Process in a canner—boil 15 minutes for 1/2 pints, 20 minutes for pints.
prep_time_minutes:
cook_time_minutes: 360
servings:
source_url: ""
tags:
  - side
  - crockpot

ingredients:
  - quantity: "2 lbs"
    name: cherry or grape tomatoes
    notes: halved or left whole
  - quantity: "4 cloves"
    name: garlic
    notes: smashed
  - quantity: "1/2 cup"
    name: extra-virgin olive oil
    notes: ""
  - quantity: "1 tbsp."
    name: honey
    notes: ""
  - quantity: "2 tbsp."
    name: balsamic vinegar
    notes: ""
  - quantity: "2"
    name: bushy sprigs fresh herbs
    notes: e.g. rosemary or thyme; about 5 inches rosemary works well
  - quantity: "1/2 tsp."
    name: red pepper flakes
    notes: optional; heaping 1/4 tsp. also works
  - quantity: ""
    name: kosher salt and black pepper
    notes: to taste
  - quantity: ""
    name: lemon juice
    notes: juice of 1/4 lemon, about 2 tsp.

steps:
  - Combine tomatoes, garlic, olive oil, honey, vinegar, herbs, and red pepper flakes if using in a slow cooker. Season with salt and pepper.
  - Cook on LOW for about 6 hours until tomatoes are soft and wrinkled, with some burst.
  - Remove herb sprigs. Stir in lemon juice and adjust seasoning to taste.
  - Refrigerate in an airtight container, or can per your usual method.


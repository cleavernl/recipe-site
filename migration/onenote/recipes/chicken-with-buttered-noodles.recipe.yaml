title: Chicken with Buttered Noodles
description: |
  One-pan meal; easy to add veggies in the pan or serve on the side. Variations tried: use butter with olive oil for better browning; dredge chicken in salt, pepper, poultry seasoning, and onion powder; sprinkle Parmesan on top instead of in sauce; add a bit of cream cheese to the sauce; skip extra butter in the sauce; stir a good amount of fresh parsley into the sauce just before returning chicken; sliced mushrooms in the sauce would also work well.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - pasta
  - chicken
  - dinner

ingredients:
  - quantity: "4"
    name: boneless skinless chicken breasts
    notes: ""
  - quantity: "2 tbsp."
    name: olive oil
    notes: butter with oil also works for browning
  - quantity: "3 cloves"
    name: garlic
    notes: minced
  - quantity: "2 cups"
    name: chicken broth
    notes: ""
  - quantity: "1 cup"
    name: heavy cream
    notes: or half and half
  - quantity: "8 oz"
    name: egg noodles
    notes: ""
  - quantity: "3 tbsp."
    name: butter
    notes: ""
  - quantity: "1/4 cup"
    name: grated Parmesan cheese
    notes: can sprinkle on top at serving
  - quantity: ""
    name: salt and pepper
    notes: to taste; poultry seasoning and onion powder for dredging optional
  - quantity: ""
    name: fresh parsley
    notes: chopped, optional
  - quantity: ""
    name: cream cheese
    notes: optional, for sauce
  - quantity: ""
    name: fresh mushrooms
    notes: sliced, optional

steps:
  - Heat olive oil in a large skillet over medium heat. Season chicken with salt and pepper (and optional dredge seasonings). Cook 5–6 minutes per side until golden and cooked through. Remove and set aside.
  - In the same skillet, add garlic and cook until fragrant. Stir in chicken broth and heavy cream; bring to a simmer. Add egg noodles, cover, and cook until tender, 8–10 minutes.
  - Stir in butter and Parmesan until melted and creamy. Return chicken to heat through.
  - Garnish with parsley and serve warm.


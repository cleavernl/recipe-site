title: Chicken and Rice
description: ""
prep_time_minutes:
cook_time_minutes: 55
servings:
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "1 tbsp."
    name: olive oil
    notes: ""
  - quantity: "6"
    name: chicken thighs
    notes: about 4 oz each, bone-in, skin-on
  - quantity: "1 1/2 tsp."
    name: kosher salt
    notes: divided
  - quantity: "3/4 tsp."
    name: ground black pepper
    notes: ""
  - quantity: "1 tbsp."
    name: unsalted butter
    notes: ""
  - quantity: "2/3 cup"
    name: yellow onion
    notes: finely chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 1/2 cups"
    name: long-grain rice
    notes: uncooked
  - quantity: "3 cups"
    name: chicken stock
    notes: divided, plus more if needed
  - quantity: "1 tbsp."
    name: flat-leaf parsley
    notes: finely chopped
  - quantity: "1"
    name: lemon
    notes: small, cut into wedges

steps:
  - Preheat oven to 375°F.
  - Heat oil in a Dutch oven over medium-high heat. Sprinkle chicken thighs evenly with 1 teaspoon salt and 1/2 teaspoon pepper.
  - Place chicken skin-side down in the Dutch oven; cook undisturbed until golden, crisp, and easily released, about 5 minutes. Flip and cook 3 more minutes. Transfer to a plate (chicken will not be fully cooked). 
  - Add butter to drippings and melt. Add onion; cook, stirring often, until translucent, about 3 minutes. Add garlic; cook 1 minute. Add rice; cook, stirring to coat and lightly toast, about 1 minute.
  - Stir in 3 cups stock and remaining salt and pepper. Bring to a boil, scraping browned bits from the bottom. Place chicken thighs over the rice.
  - Bake until liquid is absorbed and chicken is cooked through, 45–55 minutes. Add more stock if needed before rice and chicken are done.
  - Sprinkle with parsley and squeeze lemon juice over the top. Serve with lemon wedges.


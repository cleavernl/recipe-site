title: Chicken Francese
description: ""
prep_time_minutes:
cook_time_minutes:
servings: 4
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "4"
    name: boneless skinless chicken breasts
    notes: about 6 oz each
  - quantity: "1 tsp."
    name: kosher salt
    notes: ""
  - quantity: "1/2 tsp."
    name: freshly ground black pepper
    notes: ""
  - quantity: "2"
    name: large eggs
    notes: ""
  - quantity: "2 tbsp."
    name: grated Parmigiano-Reggiano cheese
    notes: ""
  - quantity: "1 cup"
    name: all-purpose flour
    notes: about 4 1/4 oz
  - quantity: ""
    name: vegetable oil
    notes: for frying, to 1/8-inch depth
  - quantity: "3 tbsp."
    name: unsalted butter
    notes: divided
  - quantity: "2 tsp."
    name: garlic
    notes: minced
  - quantity: "1 cup"
    name: dry white wine
    notes: ""
  - quantity: "4 cups"
    name: lower-sodium chicken broth
    notes: 1 quart
  - quantity: "1 1/3 cups"
    name: heavy whipping cream
    notes: ""
  - quantity: "1"
    name: Meyer or regular lemon
    notes: cut into 8 thin rounds, seeds removed
  - quantity: "1/4 cup"
    name: flat-leaf parsley
    notes: chopped, plus more for garnish

steps:
  - Working one at a time, place each chicken breast in a large freezer bag and gently pound to 1/2-inch thickness. Season all over with salt and pepper.
  - Whisk eggs and grated cheese in a shallow bowl. Place flour in another shallow bowl.
  - Heat oil to 1/8-inch depth in a deep large skillet over medium. Dredge chicken in flour, shake off excess, dip in egg mixture, and fry in batches of two until golden and cooked through, about 4 minutes per side. Drain on paper towels.
  - Discard oil and wipe skillet clean. Melt 2 tablespoons butter over medium. Add garlic; cook until fragrant, about 30 seconds. Stir in wine; simmer over high until reduced by half, about 5 minutes. Add broth; simmer until reduced by half, about 10 minutes. Stir in cream, bring to a boil, then simmer over medium-high until sauce coats a spoon, about 10 minutes.
  - Meanwhile, melt remaining 1 tablespoon butter in a medium skillet over medium. Arrange lemon slices in a single layer; cook undisturbed until caramelized at edges, 5–8 minutes. Set aside.
  - Stir parsley into cream sauce; reduce heat to medium-low. Add chicken and simmer until heated through, about 2 minutes.
  - Divide chicken among plates, spoon sauce over top, add caramelized lemon slices, and garnish with parsley.


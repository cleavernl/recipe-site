title: Ravioli Lasagna
description: |
  Crockpot Ravioli Lasagna. Serves 6–8. Quantities are flexible—layer until ingredients are used.
prep_time_minutes:
cook_time_minutes:
servings: 8
source_url: ""
tags:
  - crockpot
  - pasta
  - dinner

ingredients:
  - quantity: ""
    name: frozen cheese ravioli
    notes: as needed for layering
  - quantity: ""
    name: Parmesan cheese
    notes: shredded, as needed for layering
  - quantity: ""
    name: mozzarella cheese
    notes: shredded, as needed for layering
  - quantity: "1 jar"
    name: pasta sauce
    notes: your favorite brand
  - quantity: "1–2 lbs"
    name: ground beef
    notes: browned and drained; or 1 lb ground beef plus 1 lb Italian sausage (mild and spicy blend)
  - quantity: ""
    name: onion
    notes: diced
  - quantity: ""
    name: garlic
    notes: optional, based on sauce

steps:
  - In a large skillet, brown ground beef and diced onion over medium heat. Add garlic toward the end of browning. Drain excess fat and set aside.
  - Lightly grease the bottom and sides of your crockpot. Spread a thin layer of pasta sauce on the bottom. Place a layer of frozen cheese ravioli over the sauce. Sprinkle a portion of the browned meat over the ravioli. Add a layer of shredded Parmesan and mozzarella on top.
  - Repeat layers—pasta sauce, ravioli, meat, and cheeses—until all ingredients are used, ending with a final layer of sauce and cheese on top.
  - Cover and cook on LOW for 4–5 hours, or on HIGH for 2–3 hours, until ravioli is tender and cheese is melted and bubbly.
  - Serve hot, garnished with additional Parmesan or fresh herbs if desired.


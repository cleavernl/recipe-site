title: Tortellini with Asparagus & Mushrooms
description: |
  Optional add-ins: fresh dill, crumbled feta, chives. Easy to add chicken or shrimp. Broccoli or zucchini can replace or supplement asparagus.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - pasta
  - vegetarian
  - dinner

ingredients:
  - quantity: "1 lb"
    name: fresh cheese tortellini
    notes: ""
  - quantity: "1 bunch"
    name: asparagus
    notes: tough ends trimmed; cut into 1–2 inch pieces (about 2 cups)
  - quantity: ""
    name: mushrooms
    notes: sliced
  - quantity: "2 tbsp."
    name: butter
    notes: ""
  - quantity: "2 tbsp."
    name: olive oil
    notes: plus more if needed
  - quantity: "3 cloves"
    name: garlic
    notes: minced
  - quantity: "1/2"
    name: lemon
    notes: juiced, plus zest
  - quantity: "1/4–1/2 cup"
    name: white wine
    notes: add as needed
  - quantity: "1/8 tsp."
    name: pepper
    notes: ""
  - quantity: "1"
    name: medium onion
    notes: diced
  - quantity: ""
    name: fresh parsley
    notes: minced
  - quantity: ""
    name: fresh basil
    notes: minced
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: grated Parmesan cheese
    notes: for serving

steps:
  - Trim tough ends off asparagus and discard. Cut spears into 1–2 inch pieces.
  - Bring water to a boil in a large pot. Add tortellini and asparagus; cook about 2 minutes. Drain and set aside.
  - Add butter and olive oil to the pot. Add onion and mushrooms; cook 1–3 minutes.
  - Add garlic, lemon juice and zest, white wine, parsley, basil, salt, and pepper. Stir to combine.
  - Return tortellini and asparagus to the pot. Add more wine and/or olive oil if needed.
  - Serve sprinkled with Parmesan and optional feta, dill, or chives.


title: Tex-Mex Zucchini and Squash Bake
description: |
  A vibrant and cheesy dish that combines fresh zucchini and yellow squash with black beans, corn, and taco seasoning—perfect for a comforting weeknight meal. About 220 kcal per serving (per original notes).
prep_time_minutes: 15
cook_time_minutes: 40
servings: 6
source_url: ""
tags:
  - vegetarian
  - dinner

ingredients:
  - quantity: "2"
    name: medium zucchini
    notes: sliced
  - quantity: "2"
    name: small yellow squash
    notes: sliced
  - quantity: "1/2 cup"
    name: canned black beans
    notes: rinsed and drained
  - quantity: "1/2 cup"
    name: corn
    notes: fresh, frozen, or canned
  - quantity: "1"
    name: medium tomato
    notes: diced
  - quantity: "1 tbsp."
    name: taco seasoning
    notes: ""
  - quantity: "1 cup"
    name: shredded cheddar cheese
    notes: ""
  - quantity: "1/2 cup"
    name: shredded pepper jack cheese
    notes: ""
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1 tsp."
    name: garlic powder
    notes: ""
  - quantity: "2 tbsp."
    name: butter
    notes: melted
  - quantity: ""
    name: salt and pepper
    notes: to taste

steps:
  - Preheat oven to 375°F (190°C). Grease a 9×13-inch baking dish with cooking spray or butter.
  - In a large mixing bowl, combine sliced zucchini, yellow squash, black beans, corn, and diced tomato.
  - Drizzle olive oil over the vegetable mixture. Sprinkle with taco seasoning, garlic powder, salt, and pepper. Toss until well coated.
  - Spread the vegetable mixture evenly in the prepared baking dish. Top with cheddar and pepper jack cheese in an even layer.
  - Drizzle melted butter over the cheese.
  - Cover with aluminum foil and bake for 25 minutes. Remove foil and bake for 10–15 minutes more, until cheese is bubbly and golden brown.
  - Let cool a few minutes before serving.


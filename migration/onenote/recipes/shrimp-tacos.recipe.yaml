ingredients:
  - quantity: "1 lb"
    name: large or jumbo shrimp
    notes: peeled, deveined, tails removed; fresh or frozen and thawed
  - quantity: "1 tbsp."
    name: extra-virgin olive oil
    notes: divided
  - quantity: "1 tsp."
    name: chili powder
    notes: ""
  - quantity: "1 tsp."
    name: ground chipotle chili pepper
    notes: ""
  - quantity: "1 tsp."
    name: ground cumin
    notes: ""
  - quantity: "1/2 tsp."
    name: kosher salt
    notes: for shrimp
  - quantity: "6–8"
    name: corn or flour tortillas
    notes: ""
  - quantity: "1 cup"
    name: nonfat plain Greek yogurt
    notes: for slaw and taco sauce
  - quantity: "2 tbsp."
    name: extra-virgin olive oil
    notes: for slaw and taco sauce
  - quantity: "1 clove"
    name: garlic
    notes: peeled, for sauce
  - quantity: "1/2"
    name: small jalapeño
    notes: seeds and membranes removed, for sauce
  - quantity: "1/4 cup"
    name: fresh cilantro leaves
    notes: tightly packed, for sauce
  - quantity: "1/4 tsp."
    name: kosher salt
    notes: for sauce
  - quantity: ""
    name: lime zest and juice
    notes: 1 large or 2 very small limes; about 2 tsp. zest and 3 tbsp. juice
  - quantity: "2 cups"
    name: shredded cabbage
    notes: or slaw mix
  - quantity: ""
    name: avocado
    notes: garnish
  - quantity: ""
    name: cilantro
    notes: garnish
  - quantity: ""
    name: sour cream or Greek yogurt
    notes: garnish
  - quantity: ""
    name: lime wedges
    notes: garnish
  - quantity: ""
    name: mango salsa
    notes: garnish, optional

steps:
  - Rinse and pat shrimp dry. Transfer to a large mixing bowl. Drizzle with 1/2 tablespoon olive oil and sprinkle with chili powder, chipotle, cumin, and salt. Toss to coat evenly. Let rest while preparing sauce and slaw.
  - In a food processor, blend Greek yogurt, olive oil, garlic, jalapeño, cilantro, salt, lime zest, and lime juice until smooth. Taste and adjust seasonings. Toss cabbage with about 1/2 cup sauce (add more for creamier slaw). Reserve remaining sauce for serving.
  - In a large nonstick skillet over medium-high heat, warm remaining 1/2 tablespoon olive oil. Add shrimp and sauté until cooked through and no longer translucent, about 4 minutes. Do not overcook. Transfer immediately to a plate.
  - Optionally warm tortillas in the microwave (stacked, covered with a lightly damp towel) or in a 250°F oven while shrimp cook.
  - Fill tortillas with shrimp. Top with slaw, extra sauce, lime juice, and desired garnishes. Serve immediately.


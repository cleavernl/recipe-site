title: Fiery Fiesta Chicken Casserole
description: ""
prep_time_minutes:
cook_time_minutes: 30
servings:
source_url: ""
tags:
  - chicken
  - casserole
  - dinner

ingredients:
  - quantity: "2 cups"
    name: cooked shredded chicken
    notes: rotisserie works great
  - quantity: "1 can"
    name: corn kernels
    notes: 15 oz, drained
  - quantity: "1/2 cup"
    name: frozen fire-roasted corn
    notes: optional, for extra flavor
  - quantity: "1/2 cup"
    name: sour cream
    notes: ""
  - quantity: "1/4 cup"
    name: mayonnaise
    notes: ""
  - quantity: "1/2 tsp."
    name: chili powder
    notes: ""
  - quantity: "1/2 tsp."
    name: cumin
    notes: ""
  - quantity: "1/2 tsp."
    name: garlic powder
    notes: ""
  - quantity: ""
    name: lime juice
    notes: juice of 1 lime
  - quantity: "1/4 cup"
    name: fresh cilantro
    notes: chopped, plus extra for topping
  - quantity: "1/2 cup"
    name: crumbled cotija cheese
    notes: or feta
  - quantity: "1 cup"
    name: shredded Monterey Jack or cheddar cheese
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: "1 cup"
    name: crushed tortilla chips
    notes: for topping
  - quantity: ""
    name: green onions and/or chives
    notes: for garnish

steps:
  - Preheat oven to 350°F (175°C). Grease a baking dish with cooking spray.
  - In a large bowl, combine shredded chicken, corn kernels, fire-roasted corn, sour cream, mayonnaise, chili powder, cumin, garlic powder, lime juice, chopped cilantro, cotija cheese, and shredded Monterey Jack or cheddar cheese. Season with salt and pepper and mix well.
  - Transfer the chicken mixture to the prepared baking dish and spread evenly. Top with crushed tortilla chips.
  - Bake for 25–30 minutes, or until bubbly and the top is golden brown.
  - Remove from the oven and let cool slightly. Garnish with extra cilantro, and green onions or chives if desired. Serve hot.


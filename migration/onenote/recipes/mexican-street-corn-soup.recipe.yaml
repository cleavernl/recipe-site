ingredients:
  - quantity: "4 cups"
    name: corn
    notes: fresh, frozen, or canned
  - quantity: "1"
    name: medium onion
    notes: diced
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "4 cups"
    name: vegetable broth
    notes: ""
  - quantity: "1 cup"
    name: heavy cream
    notes: ""
  - quantity: "1 tsp."
    name: chili powder
    notes: ""
  - quantity: "1 tsp."
    name: cumin
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: fresh cilantro
    notes: for garnish
  - quantity: ""
    name: lime wedges
    notes: for serving
  - quantity: ""
    name: oil
    notes: for sautéing (as needed)

steps:
  - Heat a little oil in a large pot over medium heat. Add onion and garlic; cook until onion is translucent.
  - Stir in corn and cook for a few minutes.
  - Add vegetable broth and bring to a simmer.
  - Season with chili powder, cumin, salt, and pepper. Stir to combine.
  - Simmer for about 15 minutes to develop flavor.
  - Use an immersion blender to blend the soup to your preferred texture.
  - Stir in heavy cream and heat gently until warmed through.
  - Serve hot, topped with cilantro and lime juice.


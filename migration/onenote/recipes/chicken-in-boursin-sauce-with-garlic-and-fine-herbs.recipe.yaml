title: Chicken in Boursin Sauce with Garlic and Fine Herbs
description: |
  Creamy Boursin garlic herb chicken skillet. Dijon mustard is optional in the original but recommended for depth. Serve over mashed potatoes, pasta, rice, or crusty bread. About 460 kcal per serving (per original notes).
prep_time_minutes: 10
cook_time_minutes: 20
servings: 4
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "4"
    name: boneless skinless chicken breasts
    notes: or thighs
  - quantity: ""
    name: salt and freshly ground black pepper
    notes: to taste
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "3 cloves"
    name: garlic
    notes: minced
  - quantity: "1"
    name: medium onion
    notes: diced
  - quantity: "1 cup"
    name: chicken broth
    notes: ""
  - quantity: "1"
    name: Boursin cheese
    notes: 5.2 oz, Garlic & Fine Herbs flavor
  - quantity: "1/2 cup"
    name: heavy cream
    notes: or fat-free half and half
  - quantity: "1 tbsp."
    name: Dijon mustard
    notes: optional but recommended
  - quantity: ""
    name: fresh thyme or parsley
    notes: for garnish

steps:
  - Season chicken with salt and pepper on both sides.
  - Heat olive oil in a large skillet over medium-high heat. Sear chicken 5–6 minutes per side until golden and cooked through. Remove and set aside.
  - Lower heat to medium. Add onion and garlic; sauté about 1 minute until fragrant.
  - Pour in chicken broth and stir to deglaze. Simmer 2–3 minutes.
  - Add Boursin and stir until melted and smooth. Stir in heavy cream and Dijon mustard if using until well combined.
  - Return chicken to the skillet and spoon sauce over top. Simmer 3–5 minutes more.
  - Garnish with thyme or parsley and serve hot.


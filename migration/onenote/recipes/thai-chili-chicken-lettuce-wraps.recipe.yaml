title: Thai Chili Chicken Lettuce Wraps
description: |
  Savory lettuce wraps with Thai chili sauce. Can be made with ground chicken, turkey, pork, or beef.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "1 lb"
    name: ground chicken
    notes: or ground turkey, pork, or beef
  - quantity: "2 tbsp."
    name: vegetable oil
    notes: ""
  - quantity: "1"
    name: small onion
    notes: chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 cup"
    name: carrots
    notes: shredded
  - quantity: "1 cup"
    name: bell peppers
    notes: diced
  - quantity: "3 tbsp."
    name: soy sauce
    notes: ""
  - quantity: "2 tbsp."
    name: fish sauce
    notes: ""
  - quantity: "1 tbsp."
    name: lime juice
    notes: ""
  - quantity: "1 tbsp."
    name: brown sugar
    notes: ""
  - quantity: ""
    name: peanuts or cashews
    notes: optional
  - quantity: "1"
    name: butter or iceberg lettuce
    notes: butter lettuce preferred
  - quantity: ""
    name: Thai chili sauce
    notes: for serving
  - quantity: ""
    name: fresh herbs
    notes: cilantro or mint, for garnish

steps:
  - Heat vegetable oil in a large skillet over medium heat. Add onion and garlic; sauté about 2 minutes until fragrant.
  - Add ground meat and cook until browned, breaking it apart with a spatula.
  - Stir in shredded carrots and diced bell peppers. Cook 3–4 minutes until vegetables soften slightly.
  - In a small bowl, whisk together soy sauce, fish sauce, lime juice, and brown sugar. Pour over the meat and vegetables; stir well and cook 2–3 minutes more.
  - Spoon mixture into lettuce leaves. Drizzle with Thai chili sauce and garnish with fresh herbs. Add peanuts or cashews if desired.


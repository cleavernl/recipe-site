title: Italian Sausage Tortellini Soup
description: |
  Hearty Italian Sausage Tortellini Soup.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - soup
  - dinner

ingredients:
  - quantity: "1 lb"
    name: Italian sausage
    notes: ground; sweet and spicy half-and-half works well (freeze leftover half for next batch)
  - quantity: "1"
    name: onion
    notes: diced
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "4 cups"
    name: chicken broth
    notes: ""
  - quantity: "1 can"
    name: diced tomatoes
    notes: 14.5 oz
  - quantity: "1 cup"
    name: tortellini
    notes: fresh or frozen
  - quantity: "2 cups"
    name: spinach
    notes: ""
  - quantity: "1 tsp."
    name: Italian seasoning
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: Parmesan cheese
    notes: for serving

steps:
  - Heat a large pot over medium heat and add the Italian sausage. Cook until browned, then drain any excess fat.
  - Add diced onion and minced garlic. Cook until the onion becomes translucent.
  - Pour in chicken broth and add diced tomatoes. Bring to a boil.
  - Stir in tortellini and Italian seasoning. Reduce heat and simmer for about 5–7 minutes, or until tortellini is cooked through.
  - Add spinach and cook until wilted.
  - Season with salt and pepper to taste.
  - Serve hot, topped with grated Parmesan cheese.


title: Chicken Zucchini Bake
description: |
  Wholesome cheesy casserole with chicken and zucchini.

  Mom/Kara variations: half zucchini and half summer squash; add mushrooms, tomato, red/orange pepper; 3–4 garlic cloves toward end of sauté. Spice direction used fresh parsley, Thai basil, curry powder, garam masala, turmeric, fennel, and cayenne (skip oregano on that path—or go Italian with oregano/basil/tomato). Half sour cream and half ricotta works well; scale up ingredients if using more chicken and veggies; Parmesan optional or light. Eggs need not increase with larger batch.

  Next time idea: add rice (1/2–1 cup) with about double that amount of chicken broth so it can cook through while baking.

  - quantity: ""
    name: olive oil
    notes: for sautéing

steps:
  - Preheat oven to 375°F (190°C).
  - Heat oil in a skillet and sauté onion and zucchini until just tender (add garlic cloves near the end if using).
  - In a large bowl, mix chicken, sautéed vegetables, mozzarella, Parmesan, eggs, sour cream or yogurt, and seasonings.
  - Pour into a greased 9×9-inch baking dish and smooth the top.
  - Bake 30–35 minutes until golden and set.
  - Cool 5–10 minutes before slicing and serving.


    notes: shredded
  - quantity: "2"
    name: medium zucchini
    notes: sliced; or mix with summer squash
  - quantity: "1"
    name: small onion
    notes: diced
  - quantity: "1 cup"
    name: shredded mozzarella cheese
    notes: ""
  - quantity: "1/2 cup"
    name: grated Parmesan
    notes: optional or use lightly
  - quantity: "2"
    name: eggs
    notes: ""
  - quantity: "1/2 cup"

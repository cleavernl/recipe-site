title: Chicken Stroganoff
description: |
  In a white wine and cream cheese sauce. Can use all cream cheese and omit sour cream if preferred. Serve over egg noodles or rice.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - chicken
  - dinner
  - pasta

ingredients:
  - quantity: "4"
    name: boneless skinless chicken breasts
    notes: sliced into strips
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1"
    name: medium onion
    notes: finely chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 cup"
    name: mushrooms
    notes: sliced
  - quantity: "1 tsp."
    name: paprika
    notes: ""
  - quantity: "1 tsp."
    name: dried thyme
    notes: ""
  - quantity: "1 cup"
    name: chicken broth
    notes: ""
  - quantity: "1/2–1 cup"
    name: white wine
    notes: ""
  - quantity: "1/2 cup"
    name: sour cream
    notes: optional if using extra cream cheese
  - quantity: "1/2 cup"
    name: cream cheese
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: fresh parsley
    notes: for garnish
  - quantity: ""
    name: egg noodles or rice
    notes: cooked, for serving

steps:
  - Heat olive oil in a large skillet over medium heat. Cook chicken strips until browned and fully cooked. Remove and set aside.
  - In the same skillet, add onion and garlic; cook until softened, about 3 minutes.
  - Add mushrooms; cook until tender and moisture is released, about 5 minutes. Sprinkle with paprika and thyme; stir to combine.
  - Pour in chicken broth and white wine, scraping up brown bits. Simmer and reduce about 5 minutes. Reduce heat to low; stir in sour cream and cream cheese until smooth.
  - Return chicken to the skillet; stir until coated. Season with salt and pepper; heat through 2–3 minutes.
  - Serve over egg noodles or rice. Garnish with parsley.


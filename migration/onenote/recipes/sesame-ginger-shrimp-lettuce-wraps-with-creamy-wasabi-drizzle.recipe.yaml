title: Sesame Ginger Shrimp Lettuce Wraps with Creamy Wasabi Drizzle
description: |
  A fresh and zesty dish perfect for a light meal or appetizer.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - seafood
  - appetizer
  - dinner

ingredients:
  - quantity: "1 lb"
    name: shrimp
    notes: peeled and deveined
  - quantity: "1 tbsp."
    name: sesame oil
    notes: ""
  - quantity: "2 tbsp."
    name: soy sauce
    notes: or non-alcoholic alternative
  - quantity: "1 tbsp."
    name: fresh ginger
    notes: minced
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 tbsp."
    name: honey
    notes: ""
  - quantity: "1"
    name: butter or romaine lettuce
    notes: leaves separated
  - quantity: "1"
    name: avocado
    notes: sliced
  - quantity: "1/4 cup"
    name: green onions
    notes: chopped
  - quantity: "1 tbsp."
    name: sesame seeds
    notes: ""
  - quantity: "1/4 cup"
    name: mayonnaise
    notes: for creamy wasabi drizzle
  - quantity: "1 tbsp."
    name: wasabi paste
    notes: for creamy wasabi drizzle
  - quantity: "1 tbsp."
    name: soy sauce
    notes: for creamy wasabi drizzle; or non-alcoholic alternative

steps:
  - In a skillet, heat sesame oil over medium heat.
  - Add shrimp, garlic, ginger, and honey; cook until shrimp are pink and cooked through.
  - Stir in soy sauce and cook for another minute.
  - In a small bowl, mix mayonnaise, wasabi paste, and soy sauce to create the drizzle.
  - To assemble, place shrimp mixture in lettuce leaves and top with avocado and green onions.
  - Drizzle creamy wasabi sauce over the top and sprinkle with sesame seeds.


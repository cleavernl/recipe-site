title: Crab Bisque
description: |
  Ultimate Creamy Crab Bisque.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - soup
  - seafood

ingredients:
  - quantity: "3 tbsp."
    name: butter
    notes: ""
  - quantity: "1"
    name: medium onion
    notes: finely chopped
  - quantity: "2"
    name: stalks celery
    notes: finely chopped
  - quantity: ""
    name: Kosher salt
    notes: to taste
  - quantity: ""
    name: freshly ground black pepper
    notes: to taste
  - quantity: "1 tsp."
    name: Old Bay seasoning
    notes: ""
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "2 tbsp."
    name: tomato paste
    notes: ""
  - quantity: "3 tbsp."
    name: flour
    notes: ""
  - quantity: "4 c."
    name: fish stock
    notes: or low-sodium vegetable or chicken broth
  - quantity: "1 c."
    name: dry white wine
    notes: ""
  - quantity: "1"
    name: bay leaf
    notes: ""
  - quantity: "1/2 c."
    name: heavy cream
    notes: or half and half (increase flour to 1/4 c if using half and half)
  - quantity: "1 lb."
    name: lump crab meat
    notes: optional 1 lb shrimp; if adding shrimp, increase cream to 1 c
  - quantity: ""
    name: freshly chopped parsley
    notes: for garnish

steps:
  - Melt the butter in a large, heavy pot over medium heat.
  - Add the finely chopped onion and celery. Cook for about 5 minutes until softened.
  - Season with Kosher salt, freshly ground black pepper, and Old Bay seasoning.
  - Stir in the minced garlic and tomato paste. Cook for an additional 2 minutes until the garlic is aromatic and the vegetables are well-coated.
  - Sprinkle the flour over the vegetable mixture. Cook for about 1 minute until the flour is fully absorbed.
  - Gradually add the fish stock and dry white wine, along with the bay leaf.
  - Lower the heat and let it simmer for about 30 minutes, stirring occasionally.
  - Remove the bay leaf and use an immersion blender to purée the soup until smooth.
  - Return the pot to medium-low heat and incorporate the heavy cream and half of the lump crab meat.
  - Heat the mixture for about 5 minutes until just warmed through.
  - Serve the bisque in bowls, garnished with the remaining crab meat and freshly chopped parsley.


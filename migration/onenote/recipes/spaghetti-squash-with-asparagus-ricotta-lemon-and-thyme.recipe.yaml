title: Spaghetti Squash with Asparagus, Ricotta, Lemon, and Thyme
description: |
  A light and refreshing dish featuring spaghetti squash, asparagus, creamy ricotta, zesty lemon, and fragrant thyme. Angel hair pasta can be substituted; a fine pasta works well.
prep_time_minutes:
cook_time_minutes: 40
servings:
source_url: ""
tags:
  - vegetarian
  - dinner

ingredients:
  - quantity: "1"
    name: medium spaghetti squash
    notes: or angel hair pasta
  - quantity: "1 bunch"
    name: asparagus
    notes: trimmed and cut into bite-sized pieces
  - quantity: "1 tbsp."
    name: olive oil
    notes: plus more for roasting squash
  - quantity: "1 cup"
    name: ricotta cheese
    notes: ""
  - quantity: ""
    name: lemon zest
    notes: zest of 1 lemon, plus extra for garnish
  - quantity: ""
    name: lemon juice
    notes: juice of 1 lemon
  - quantity: "1 tbsp."
    name: fresh thyme leaves
    notes: plus extra for garnish
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: onion
    notes: optional; used in directions
  - quantity: ""
    name: garlic
    notes: optional; add midway through cooking asparagus
  - quantity: ""
    name: fresh parsley
    notes: optional
  - quantity: ""
    name: freshly ground black pepper
    notes: optional
  - quantity: ""
    name: other fresh herbs
    notes: optional

steps:
  - Preheat oven to 400°F (200°C).
  - Cut spaghetti squash in half lengthwise and scoop out the seeds.
  - Drizzle cut sides with olive oil and season with salt and pepper.
  - Place squash halves cut-side down on a baking sheet and roast for 30–40 minutes, or until tender.
  - While squash roasts, heat olive oil in a skillet over medium heat. Add onion and asparagus; sauté for 5–7 minutes until tender-crisp. Add garlic about midway through cooking asparagus.
  - In a bowl, combine ricotta, lemon zest, lemon juice, thyme, salt, pepper, and other herbs as desired.
  - Once squash is cooked, use a fork to scrape flesh into strands.
  - Toss spaghetti squash with asparagus and ricotta mixture until well combined.
  - Serve warm, garnished with additional thyme and lemon zest.


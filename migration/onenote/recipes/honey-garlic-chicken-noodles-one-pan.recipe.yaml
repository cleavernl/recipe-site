title: Honey Garlic Chicken Noodles
description: |
  One-pan meal.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - pasta
  - chicken
  - dinner

ingredients:
  - quantity: "2"
    name: chicken breasts
    notes: diced
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "4 cloves"
    name: garlic
    notes: minced
  - quantity: ""
    name: fresh ginger
    notes: ""
  - quantity: "1/4 cup"
    name: honey
    notes: ""
  - quantity: "2 tbsp."
    name: soy sauce
    notes: ""
  - quantity: "1/2 tsp."
    name: crushed red pepper flakes
    notes: optional
  - quantity: "2 cups"
    name: chicken broth
    notes: ""
  - quantity: "8 oz"
    name: egg noodles
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: ""
    name: fresh parsley
    notes: chopped, optional

steps:
  - Heat olive oil in a large pot over medium heat. Add diced chicken and cook until browned, about 5–7 minutes. Season with salt and pepper.
  - Add minced garlic and ginger; cook for another minute until fragrant. Stir in honey, soy sauce, and red pepper flakes if using.
  - Pour in chicken broth and bring to a simmer. Add egg noodles and stir to combine.
  - Cover the pot and cook for 8–10 minutes, stirring occasionally, until noodles are tender and the sauce has thickened. Adjust seasoning with salt and pepper if needed.
  - Garnish with fresh parsley and serve.


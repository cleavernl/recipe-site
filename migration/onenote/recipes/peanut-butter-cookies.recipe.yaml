title: Peanut Butter Cookies
description: ""
prep_time_minutes:
cook_time_minutes: 10
servings:
source_url: ""
tags:
  - dessert

ingredients:
  - quantity: "1 cup"
    name: peanut butter
    notes: ""
  - quantity: "1/2 cup"
    name: butter
    notes: softened
  - quantity: "1/2 cup"
    name: white sugar
    notes: ""
  - quantity: "1/2 cup"
    name: brown sugar
    notes: packed
  - quantity: "1"
    name: large egg
    notes: ""
  - quantity: "3 tbsp."
    name: milk
    notes: ""
  - quantity: "1 tsp."
    name: vanilla extract
    notes: ""
  - quantity: "1 1/4 cups"
    name: all-purpose flour
    notes: ""
  - quantity: "3/4 tsp."
    name: baking powder
    notes: ""
  - quantity: "1/4 tsp."
    name: salt
    notes: ""

steps:
  - Beat peanut butter, butter, white sugar, and brown sugar in a large bowl with an electric mixer until well blended.
  - Beat in egg until well combined. Mix in milk and vanilla.
  - Combine flour, baking powder, and salt in a separate bowl; stir into peanut butter mixture until incorporated.
  - Roll tablespoonfuls of dough into balls. Place cookies 2 inches apart on ungreased cookie sheets.
  - Press each ball crosswise with fork tines. Bake in a 375°F preheated oven until edges are lightly browned, 8–10 minutes.


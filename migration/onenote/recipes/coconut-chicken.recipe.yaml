title: Coconut Chicken
description: |
  With spicy Brazilian creamy coconut sauce.
prep_time_minutes:
cook_time_minutes: 25
servings:
source_url: ""
tags:
  - chicken
  - dinner

ingredients:
  - quantity: "2 lbs"
    name: boneless skinless chicken thighs
    notes: or breasts
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1"
    name: large onion
    notes: finely chopped
  - quantity: "4 cloves"
    name: garlic
    notes: minced
  - quantity: "1"
    name: red bell pepper
    notes: sliced
  - quantity: "1"
    name: yellow bell pepper
    notes: sliced
  - quantity: "1 tbsp."
    name: fresh ginger
    notes: grated
  - quantity: "1 tsp."
    name: paprika
    notes: ""
  - quantity: "1/2 tsp."
    name: crushed red pepper flakes
    notes: ""
  - quantity: "1/2 tsp."
    name: turmeric
    notes: ""
  - quantity: "1 tsp."
    name: ground cumin
    notes: ""
  - quantity: ""
    name: salt and black pepper
    notes: to taste
  - quantity: "1 can"
    name: full-fat coconut milk
    notes: 14 oz
  - quantity: "1/2 cup"
    name: chicken broth
    notes: ""
  - quantity: "1 tbsp."
    name: tomato paste
    notes: ""
  - quantity: ""
    name: lime juice
    notes: juice of 1 lime
  - quantity: "1/4 cup"
    name: fresh cilantro
    notes: chopped
  - quantity: ""
    name: green onions and/or chives
    notes: for garnish

steps:
  - Heat olive oil in a large skillet over medium-high heat. Sear chicken until golden on both sides, about 4–5 minutes per side. Remove and set aside.
  - Reduce heat to medium. Cook onion until softened, 3–4 minutes. Add garlic, ginger, and bell peppers; sauté until fragrant. Add paprika, turmeric, cumin, red pepper flakes, salt, and pepper; stir to combine.
  - Mix in tomato paste, then pour in coconut milk and chicken broth. Stir until smooth and bubbling.
  - Return chicken to the skillet and coat with sauce. Reduce heat to low, cover, and simmer 20–25 minutes until chicken is cooked through and tender.
  - Finish with lime juice and cilantro. Garnish with green onions or chives if desired.


title: Eggplant Roll-Ups with Creamy Ricotta and Spinach
description: |
  About 320 kcal per serving (per original notes).
prep_time_minutes: 20
cook_time_minutes: 40
servings: 4
source_url: ""
tags:
  - vegetarian
  - dinner

ingredients:
  - quantity: "2"
    name: medium eggplants
    notes: aubergines
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: "15 oz"
    name: canned chopped tomatoes
    notes: 400 g
  - quantity: "1"
    name: shallot
    notes: finely chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1/2 tbsp."
    name: tomato paste
    notes: ""
  - quantity: "1 cup"
    name: ricotta cheese
    notes: ""
  - quantity: "1 cup"
    name: fresh spinach
    notes: chopped
  - quantity: "1/2 cup"
    name: grated Parmesan cheese
    notes: ""
  - quantity: "1"
    name: egg
    notes: lightly beaten
  - quantity: "1/2 tsp."
    name: dried oregano
    notes: ""
  - quantity: "1/2 tsp."
    name: dried basil
    notes: ""
  - quantity: ""
    name: fresh basil leaves
    notes: for garnish

steps:
  - Preheat oven to 375°F (190°C). Lightly grease a baking dish with olive oil.
  - Slice eggplants lengthwise into thin strips. Brush lightly with olive oil, season with salt and pepper, and arrange on a baking sheet. Roast for 12–15 minutes until softened. Remove and let cool slightly.
  - While eggplants bake, prepare the tomato sauce. Heat 1 tablespoon olive oil in a saucepan over medium heat. Add shallot and garlic; sauté for 2–3 minutes until fragrant. Stir in tomato paste, chopped tomatoes, oregano, basil, salt, and pepper. Simmer for 10 minutes until thickened.
  - In a bowl, mix ricotta, spinach, Parmesan, egg, salt, and pepper until smooth.
  - Spread a spoonful of ricotta mixture onto each roasted eggplant slice, then roll up tightly.
  - Spread half the tomato sauce in the baking dish. Arrange eggplant roll-ups seam-side down. Top with remaining sauce and extra Parmesan.
  - Bake for 25–30 minutes until bubbly and golden. Garnish with fresh basil before serving.


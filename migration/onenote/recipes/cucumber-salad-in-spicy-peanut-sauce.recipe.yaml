    notes: for garnish
  - quantity: ""
    name: fresh cilantro
    notes: for garnish

steps:
  - Slice cucumbers into rounds or sticks.
  - In a bowl, whisk together peanut butter, soy sauce, honey, rice vinegar, sriracha, minced garlic, and sesame oil until smooth.
  - Add cucumber slices to the bowl and toss until well coated.
  - Transfer to a serving dish and sprinkle with chopped peanuts and fresh cilantro.


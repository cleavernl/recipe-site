title: Shrimp & Creamed Corn in Spiced Feta Sauce
description: |
  A vibrant one-pan dish featuring tender shrimp sautéed with sweet corn in a creamy, spiced feta sauce—ready in about 30 minutes. About 455 kcal per serving. Serve as is, or over rice, pasta, couscous, or egg noodles.
prep_time_minutes: 10
cook_time_minutes: 20
servings: 4
source_url: ""
tags:
  - seafood
  - dinner

ingredients:
  - quantity: "1 1/2 lbs"
    name: large raw shrimp
    notes: peeled and deveined, about 15–20 count
  - quantity: "1 tsp."
    name: chili powder
    notes: and/or Cajun seasoning
  - quantity: "1/4 tsp."
    name: salt
    notes: ""
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "2 tbsp."
    name: salted butter
    notes: ""
  - quantity: "1/2 cup"
    name: onion
    notes: chopped
  - quantity: "5 cloves"
    name: garlic
    notes: minced
  - quantity: "1 1/2 cups"
    name: corn kernels
    notes: fresh grilled or boiled from about 2 ears
  - quantity: "1 tsp."
    name: smoked paprika
    notes: ""
  - quantity: "1 cup"
    name: half-and-half
    notes: ""
  - quantity: "4 oz"
    name: feta cheese
    notes: divided (3 oz for sauce, 1 oz for garnish)
  - quantity: ""
    name: lime juice
    notes: juice of 1/2 lime, about 1 tbsp.
  - quantity: "1/2 cup"
    name: corn kernels
    notes: for topping
  - quantity: ""
    name: lime slices
    notes: for garnish
  - quantity: ""
    name: cilantro
    notes: chopped, for garnish

steps:
  - Heat a large 12-inch skillet over medium heat with olive oil. Toss shrimp with chili powder (or Cajun seasoning) and salt. Cook in batches until pink, about 3–4 minutes total. Remove and set aside.
  - In the same skillet, melt butter. Add onion, season lightly with salt, and cook until softened, 3–4 minutes. Add garlic and cook 1–2 minutes.
  - Stir in 1 1/2 cups corn and smoked paprika.
  - Pour in half-and-half, bring to a simmer, then stir in 3 oz crumbled feta until melted into a creamy sauce.
  - Squeeze lime juice into the sauce. Return shrimp to the skillet and reheat gently.
  - Top with remaining 1/2 cup corn, extra feta, lime slices, and cilantro. Serve immediately.


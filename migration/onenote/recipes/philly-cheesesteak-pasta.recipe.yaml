ingredients:
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1"
    name: medium red bell pepper
    notes: sliced
  - quantity: "1"
    name: medium yellow onion
    notes: sliced
  - quantity: "8 oz"
    name: mushrooms
    notes: sliced
  - quantity: "12 oz"
    name: ribeye steak
    notes: frozen and thinly sliced, or ground beef
  - quantity: "1 tsp."
    name: sea salt
    notes: ""
  - quantity: "1/4 tsp."
    name: cracked black pepper
    notes: ""
  - quantity: "1/2 tsp."
    name: garlic powder
    notes: or a couple cloves fresh garlic
  - quantity: "1 tbsp."
    name: all-purpose flour
    notes: ""
  - quantity: "2 cups"
    name: beef stock
    notes: ""
  - quantity: "1/2 cup"
    name: heavy whipping cream
    notes: or fat-free half and half
  - quantity: "2 tsp."
    name: Worcestershire sauce
    notes: ""
  - quantity: "2 cups"
    name: rigatoni pasta
    notes: heaping cups
  - quantity: "1 1/4 cups"
    name: part-skim mozzarella cheese
    notes: shredded, or provolone for more authentic Philly cheesesteak
  - quantity: ""
    name: green onions or chives
    notes: for garnish, optional
  - quantity: ""
    name: fresh parsley
    notes: for garnish, optional

steps:
  - Heat oil in a large nonstick skillet over medium-high heat. If using ground beef, brown it first, then continue. If using steak, add bell pepper, onion, and mushrooms and cook for 5 minutes. Stir in meat, salt, pepper, and garlic. Cook for 2–3 minutes until beef starts to brown.
  - Whisk together flour, beef stock, heavy cream, and Worcestershire sauce. Pour into the skillet.
  - Add rigatoni and bring to a boil. Reduce heat to medium, cover, and simmer for 15 minutes, stirring often.
  - Remove lid and mix in 1/2 cup shredded mozzarella until melted. Top with remaining cheese, replace lid, and cook 5 more minutes to melt cheese.
  - Garnish with green onions or chives and fresh parsley if desired.


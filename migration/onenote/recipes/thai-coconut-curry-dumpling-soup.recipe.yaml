title: Thai Coconut Curry Dumpling Soup
description: |
  Don't boil after adding coconut milk—keep at a gentle simmer for a creamy texture. Optional veggies (bok choy, spinach, mushrooms, baby corn) can go in the last 2–3 minutes. For thicker broth, use less broth or stir in a cornstarch slurry (1 tsp cornstarch + 1 tbsp water). Vegetarian version: veggie broth, vegan fish sauce substitute, vegetable dumplings.

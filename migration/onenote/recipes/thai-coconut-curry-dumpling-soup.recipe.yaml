steps:
  - In a large soup pot, heat vegetable oil over medium heat. Add garlic, onion, and ginger. Sauté 1–2 minutes until fragrant; do not let garlic brown.
  - Pour in chicken broth and coconut milk. Stir gently and bring to a simmer.
  - Add Thai red curry paste, fish sauce, lime juice, soy sauce, brown sugar, and sesame oil. Stir well and simmer about 5 minutes.
  - Gently add frozen dumplings. Cook per package instructions, usually 5–7 minutes, until tender and floating. Add optional vegetables in the last 2–3 minutes if using.
  - Ladle into bowls and top with green onions, chives, cilantro, or other herbs. Serve hot with extra lime wedges or chili oil if desired.


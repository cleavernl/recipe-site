title: Black Bean & Butternut Squash Stew
description: |
  Soothing, creamy, and packed with goodness—a hearty plant-based stew for chilly nights. Pro tips: puree half with an immersion blender for creamier texture; add chili flakes for gentle heat; tastes even better the next day. Serve with bread or rice.

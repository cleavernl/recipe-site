steps:
  - Sauté onion and garlic in olive oil until soft.
  - Add squash, broth, cumin, smoked paprika, salt, and pepper. Simmer until squash is tender.
  - Stir in black beans and coconut milk. Simmer 5 more minutes.
  - Adjust seasoning and serve hot.


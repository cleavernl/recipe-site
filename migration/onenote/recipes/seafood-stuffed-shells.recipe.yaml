title: Seafood Stuffed Shells
description: |
  Creamy, cheesy, and packed with flavor. About 420 kcal per serving (per original notes).
prep_time_minutes: 20
cook_time_minutes: 30
servings: 4
source_url: ""
tags:
  - pasta
  - seafood
  - dinner


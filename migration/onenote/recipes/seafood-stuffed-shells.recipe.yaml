    notes: for topping

steps:
  - Preheat oven to 375°F (190°C). Grease a baking dish with olive oil.
  - In a skillet, heat olive oil and sauté garlic for 1 minute. Add shrimp and cook until pink, about 2 minutes.
  - In a bowl, mix ricotta, cream cheese, mozzarella, Parmesan, egg, parsley, Old Bay, salt, and black pepper. Fold in crab and shrimp.
  - Fill each pasta shell with the seafood mixture and arrange in the baking dish.
  - Pour Alfredo sauce over the shells and sprinkle with mozzarella and Parmesan for topping.
  - Cover with foil and bake for 20 minutes. Uncover and bake for 10 more minutes until bubbly and golden.
  - Garnish with fresh parsley and serve warm.


title: Chicken Piccata Pasta
description: ""
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - pasta
  - chicken
  - dinner

ingredients:
  - quantity: "8 oz"
    name: radiatori pasta
    notes: uncooked
  - quantity: "1 lb"
    name: boneless skinless chicken thighs
    notes: cut into 1-inch pieces
  - quantity: "1 tsp."
    name: kosher salt
    notes: ""
  - quantity: "1/2 tsp."
    name: black pepper
    notes: ""
  - quantity: "3 tbsp."
    name: extra-virgin olive oil
    notes: ""
  - quantity: "6 cloves"
    name: garlic
    notes: large, thinly sliced
  - quantity: "1/4 tsp."
    name: crushed red pepper
    notes: ""
  - quantity: "1/2 cup"
    name: dry white wine
    notes: 4 oz
  - quantity: "1/4 cup"
    name: capers
    notes: drained
  - quantity: "1/4 cup"
    name: cold unsalted butter
    notes: 2 oz, cubed
  - quantity: "1/4 cup"
    name: fresh lemon juice
    notes: plus lemon wedges for serving
  - quantity: "2 oz"
    name: Parmesan cheese
    notes: grated, about 1/2 cup
  - quantity: "1/2 cup"
    name: fresh parsley
    notes: chopped

steps:
  - Bring a large pot of salted water to a boil. Cook pasta al dente per package directions. Reserve 1 cup pasta cooking liquid. Drain pasta and set aside.
  - Sprinkle chicken with salt and pepper. Heat oil in a large skillet over medium-high until it just begins to smoke. Add chicken; cook undisturbed until browned on one side, about 4 minutes. Stir and cook until evenly browned, about 3 minutes.
  - Add garlic and crushed red pepper; cook until fragrant and starting to brown, about 1 minute. Add wine and capers; bring to a boil and reduce by half, about 1 minute.
  - Add pasta, 1/4 cup reserved pasta water, butter, and lemon juice. Cook over medium, stirring occasionally, until sauce clings to pasta, about 3 minutes (add more pasta water as needed).
  - Remove from heat. Stir in Parmesan and parsley. Serve with lemon wedges.


title: Teriyaki Shrimp and Pineapple Rice Stack
description: |
  A flavorful and refreshing dish that's perfect for a quick and easy meal. For heat, blend red pepper flakes into the marinade. Rice may be replaced with cooked quinoa or couscous. Pair with a crisp salad or steamed vegetables.
prep_time_minutes: 15
cook_time_minutes: 25
servings:
source_url: ""
tags:
  - seafood
  - dinner

ingredients:
  - quantity: "2 cups"
    name: rice
    notes: ""
  - quantity: "3 cups"
    name: chicken broth
    notes: ""
  - quantity: "1/4 cup"
    name: soy sauce
    notes: for rice
  - quantity: "1 tbsp."
    name: sesame oil
    notes: for rice
  - quantity: "1/4 tsp."
    name: garlic powder
    notes: for rice
  - quantity: "1 lb"
    name: shrimp
    notes: peeled and deveined
  - quantity: "1/4 cup"
    name: teriyaki sauce
    notes: for shrimp
  - quantity: "1 tbsp."
    name: honey
    notes: for shrimp
  - quantity: "1/2 tsp."
    name: grated ginger
    notes: for shrimp
  - quantity: "1 can"
    name: pineapple chunks
    notes: 15 oz, drained

steps:
  - In a large pot, bring chicken broth to a boil. Stir in rice, soy sauce, sesame oil, and garlic powder. Reduce heat to low, cover tightly, and simmer for 20–25 minutes, or until rice is tender and liquid is absorbed.
  - Combine teriyaki sauce, honey, and grated ginger in a bowl. Add shrimp, toss to coat, and marinate in the refrigerator for at least 15 minutes.
  - Preheat a grill or grill pan over medium-high heat. Arrange marinated shrimp in a single layer and cook for 2–3 minutes per side, until opaque and lightly charred.
  - Arrange cooked rice as the base in a serving dish. Layer grilled shrimp and pineapple chunks on top.
  - Serve immediately while warm.


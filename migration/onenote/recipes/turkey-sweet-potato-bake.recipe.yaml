title: Turkey Sweet Potato Bake
description: |
  Ground turkey and sweet potato bake—nutritious and good for any night of the week. About 350 kcal per serving (per original notes).
prep_time_minutes: 15
cook_time_minutes: 40
servings: 4
source_url: ""
tags:
  - dinner
  - casserole

ingredients:
  - quantity: "1 lb"
    name: ground turkey
    notes: ""
  - quantity: "2"
    name: medium sweet potatoes
    notes: peeled and diced
  - quantity: "1"
    name: onion
    notes: chopped
  - quantity: "2 cloves"
    name: garlic
    notes: minced
  - quantity: "1 cup"
    name: bell peppers
    notes: chopped
  - quantity: "1 tsp."
    name: paprika
    notes: ""
  - quantity: "1 tsp."
    name: cumin
    notes: ""
  - quantity: ""
    name: salt and pepper
    notes: to taste
  - quantity: "1 tbsp."
    name: olive oil
    notes: ""
  - quantity: "1/2 cup"
    name: shredded cheese
    notes: optional
  - quantity: ""
    name: fresh parsley
    notes: for garnish

steps:
  - Preheat oven to 375°F (190°C).
  - In a large skillet, heat olive oil over medium heat. Add onion and garlic; sauté until onion is translucent.
  - Add ground turkey and cook until browned. Season with paprika, cumin, salt, and pepper.
  - Stir in diced sweet potatoes and bell peppers; mix well.
  - Transfer to a baking dish and cover with aluminum foil.
  - Bake 25–30 minutes, or until sweet potatoes are tender.
  - If using cheese, uncover, sprinkle cheese on top, and bake 5–10 minutes more until melted and bubbly.
  - Garnish with fresh parsley before serving.


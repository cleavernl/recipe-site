title: Creamy Lemon Garlic Butter Chicken
description: |
  Served over spinach linguini and it was fabulous; colors are pretty.
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - crockpot
  - chicken
  - dinner

ingredients:
  - quantity: "6–8"
    name: boneless skinless chicken breasts or thighs
    notes: ""
  - quantity: "1/3 cup"
    name: low sodium chicken broth
    notes: ""
  - quantity: "2 tsp."
    name: chicken bouillon
    notes: ""
  - quantity: ""
    name: lemon juice
    notes: juice of one lemon
  - quantity: ""
    name: lemon zest
    notes: zest of half a lemon; slice the other half and reserve
  - quantity: "1 tsp."
    name: Italian seasoning
    notes: ""
  - quantity: "1 tsp."
    name: garlic powder
    notes: ""
  - quantity: "1 tsp."
    name: onion powder
    notes: ""
  - quantity: "1/2 tsp."
    name: crushed red chili pepper flakes
    notes: or cayenne
  - quantity: "1/2 tsp."
    name: paprika
    notes: ""
  - quantity: "1/2 tsp."
    name: salt
    notes: ""
  - quantity: "2/3 tsp."
    name: pepper
    notes: ""
  - quantity: "4 cloves"
    name: garlic
    notes: sliced or minced
  - quantity: "1/2 stick"
    name: butter
    notes: diced
  - quantity: "about 8 oz"
    name: fresh mushrooms
    notes: sliced, optional
  - quantity: "1 cup"
    name: heavy cream
    notes: or half and half (for cream sauce)
  - quantity: "1 tbsp."
    name: corn starch
    notes: for cream sauce
  - quantity: ""
    name: fresh parsley
    notes: chopped, for garnish
  - quantity: ""
    name: lemon slices
    notes: for garnish

steps:
  - Place chicken breasts or thighs at the bottom of your slow cooker. Combine chicken broth, bouillon, lemon juice, and zest; add optional mushrooms and pour over chicken.
  - In a small bowl, combine Italian seasoning, onion powder, garlic powder, paprika, crushed red chili pepper flakes, salt, and pepper. Sprinkle the spice mix over the chicken. Top with fresh minced garlic and diced butter.
  - Cover the crockpot and cook for 3–4 hours on HIGH or 6–8 hours on LOW.
  - In the last hour, remove the chicken breasts and set on a plate. Whisk heavy cream and corn starch into the crockpot and make sure everything is well combined. Return chicken to the crock pot, cover, and cook an additional hour.
  - Check seasoning and adjust salt and pepper.
  - Sprinkle with chopped parsley and garnish with lemon slices.
  - Serve with rice, any type of pasta, or mashed potatoes.


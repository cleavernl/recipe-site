title: Creamy Garlic Parmesan Tortellini with Chicken & Broccoli
description: |
  Season the chicken with Italian seasoning, garlic powder, salt, and pepper when cooking (mentioned in instructions but not listed in the original ingredient block).
prep_time_minutes:
cook_time_minutes:
servings:
source_url: ""
tags:
  - pasta
  - chicken
  - dinner

ingredients:
  - quantity: "2"
    name: boneless, skinless chicken breasts
    notes: cut into bite-sized pieces
  - quantity: "2 tbsp."
    name: olive oil
    notes: ""
  - quantity: "2 tbsp."
    name: butter
    notes: ""
  - quantity: "4 cloves"
    name: garlic
    notes: minced
  - quantity: "2 cups"
    name: heavy cream
    notes: ""
  - quantity: "1 cup"
    name: chicken broth
    notes: ""
  - quantity: "1 cup"
    name: grated Parmesan cheese
    notes: ""
  - quantity: "1"
    name: package cheese tortellini
    notes: 9–12 oz, refrigerated or frozen
  - quantity: "2 cups"
    name: broccoli florets
    notes: steamed or lightly cooked
  - quantity: "1/4 tsp."
    name: red pepper flakes
    notes: optional
  - quantity: ""
    name: salt and black pepper
    notes: to taste
  - quantity: ""
    name: fresh parsley
    notes: chopped, for garnish
  - quantity: ""
    name: Parmesan cheese
    notes: extra, for sprinkling

steps:
  - Heat olive oil in a large skillet over medium-high heat. Season the chicken with Italian seasoning, garlic powder, salt, and pepper. Add the chicken and cook for 5–6 minutes, or until golden brown and fully cooked. Remove from the skillet and set aside.
  - In the same skillet, melt the butter over medium heat. Add the minced garlic and sauté for 1 minute, or until fragrant.
  - Stir in the heavy cream and chicken broth, bringing the mixture to a gentle simmer.
  - Gradually whisk in the Parmesan cheese until the sauce is smooth and creamy. Add the tortellini and cook according to package instructions, usually 5–7 minutes, stirring occasionally to prevent sticking.
  - Once the tortellini is cooked, stir in the cooked chicken and broccoli florets. Add red pepper flakes if using and adjust seasoning with salt and pepper to taste.
  - Sprinkle with fresh parsley and extra Parmesan cheese if desired. Serve hot.


services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    # Rootless port publish often listens only on 127.0.0.1 inside WSL; Windows netsh portproxy
    # targets the WSL *eth0* IP, so traffic never reaches the container. Host network binds :8000
    # on the real WSL interfaces (see docs/decisions/0004).
    network_mode: host
    restart: unless-stopped
    environment:
      # Image build already runs collectstatic; omitting the runtime pass reduces cold start time.
      WEB_SKIP_START_COLLECTSTATIC: "1"
      # SQLite cannot handle concurrent writers; multiple Gunicorn workers cause intermittent 500s.
      WEB_CONCURRENCY: "1"
    env_file:
      - .env
    volumes:
      - recipe_data:/app/data
      - recipe_media:/app/media

volumes:
  recipe_data:
  recipe_media:
